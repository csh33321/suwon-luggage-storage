name: web photos
on:
  push:
    branches: [main]
    paths: ["photos-src/**", "process_photos.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  resize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip -q install pillow
          python process_photos.py
      - run: |
          git config user.name "photo-bot"
          git config user.email "photo-bot@users.noreply.github.com"
          git add img
          git diff --cached --quiet || (git commit -qm "web photos" && git push)
