name: locker status
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: status
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: previous status
        run: |
          git fetch origin status --depth=1 2>/dev/null && git show FETCH_HEAD:status.json > prev.json || true
      - name: read every 2 minutes for 5 hours
        env:
          TBOX_ID: ${{ secrets.TBOX_ID }}
          TBOX_PW: ${{ secrets.TBOX_PW }}
          PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          READ_EVERY: "120"
          HEARTBEAT: "600"
        run: |
          pip -q install requests
          python scraper.py
      - name: start the next round
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run status.yml --repo "${{ github.repository }}" --ref main
