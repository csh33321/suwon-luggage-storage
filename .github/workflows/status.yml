name: locker status
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: status
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: previous status
        run: |
          git fetch origin status --depth=1 2>/dev/null && git show FETCH_HEAD:status.json > prev.json || true
      - name: read admin page
        id: read
        env:
          TBOX_ID: ${{ secrets.TBOX_ID }}
          TBOX_PW: ${{ secrets.TBOX_PW }}
        run: |
          pip -q install requests
          python scraper.py
      - name: publish
        if: steps.read.outputs.changed == 'true'
        run: |
          mkdir out && cp status.json out/ && cd out
          git init -q -b status
          git config user.name "status-bot"
          git config user.email "status-bot@users.noreply.github.com"
          git add status.json && git commit -qm "status"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" status
